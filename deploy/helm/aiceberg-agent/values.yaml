image:
  repository: ghcr.io/aiceberg/aiceberg-agent
  tag: latest
  pullPolicy: IfNotPresent

apiBaseUrl: https://api.aiceberg.com.br

tokenSecret:
  name: aiceberg-agent
  key: token

kubernetes:
  enabled: true
  interval: 30
  maxItems: 500
  maxEvents: 100
  namespace: ""
  logs:
    enabled: false
    maxLines: 200
    maxBytes: 262144
    includeRegex: ""
    excludeRegex: ""

containers:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
