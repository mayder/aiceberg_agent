apiVersion: v1
kind: Namespace
metadata:
  name: aiceberg
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiceberg-agent
  namespace: aiceberg
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiceberg-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiceberg-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiceberg-agent
subjects:
  - kind: ServiceAccount
    name: aiceberg-agent
    namespace: aiceberg
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aiceberg-agent
  namespace: aiceberg
  labels:
    app.kubernetes.io/name: aiceberg-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aiceberg-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiceberg-agent
    spec:
      serviceAccountName: aiceberg-agent
      containers:
        - name: agent
          image: ghcr.io/aiceberg/aiceberg-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: API_BASE_URL
              value: "https://api.aiceberg.com.br"
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiceberg-agent
                  key: token
            - name: KUBERNETES_ENABLED
              value: "true"
            - name: KUBERNETES_LOGS_ENABLED
              value: "false"
            - name: KUBERNETES_LOGS_MAX_LINES
              value: "200"
            - name: KUBERNETES_LOGS_MAX_BYTES
              value: "262144"
            - name: KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTAINER_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
      terminationGracePeriodSeconds: 20
